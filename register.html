<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0">

<title>Create Account - BD Social</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f0f2f5;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.box{
    width:100%;
    max-width:420px;

    background:#fff;

    padding:28px;

    border-radius:14px;

    box-shadow:0 4px 20px rgba(0,0,0,.12);
}

.logo{
    text-align:center;

    color:#1877f2;

    font-size:30px;

    font-weight:800;

    margin-bottom:8px;
}

.subtitle{
    text-align:center;

    color:#666;

    margin-bottom:25px;
}

input{
    width:100%;

    height:48px;

    border:1px solid #ddd;

    border-radius:8px;

    padding:0 14px;

    outline:none;

    margin-bottom:12px;

    font-size:15px;
}

input:focus{
    border-color:#1877f2;
}

button{
    width:100%;

    height:48px;

    border:0;

    border-radius:8px;

    background:#1877f2;

    color:#fff;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}

button:hover{
    background:#166fe5;
}

#message{
    text-align:center;

    color:#d00;

    min-height:22px;

    margin:12px 0;
}

.login{
    text-align:center;

    margin-top:18px;

    color:#666;
}

.login a{
    color:#1877f2;

    text-decoration:none;

    font-weight:bold;
}

</style>

</head>

<body>

<div class="box">

    <div class="logo">
        BD Social
    </div>

    <div class="subtitle">
        Create your account
    </div>


    <input
        id="name"
        type="text"
        placeholder="Full name">


    <input
        id="email"
        type="email"
        placeholder="Email address">


    <input
        id="password"
        type="password"
        placeholder="Password">


    <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm password">


    <div id="message"></div>


    <button onclick="registerUser()">
        Create Account
    </button>


    <div class="login">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>

</div>


<script type="module">

import "./js/auth.js";

</script>

</body>

</html>
